<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог программ Mac OS</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Lucide Icons (via CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-sidebar: rgba(17, 24, 39, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.4);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;

      --accent-indigo: #6366f1;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --accent-blue: #0ea5e9;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;

      --font-sans: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Blobs */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, var(--accent-indigo) 0%, rgba(99, 102, 241, 0) 70%);
    }

    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, var(--accent-purple) 0%, rgba(139, 92, 246, 0) 70%);
    }

    .blob-3 {
      top: 40%;
      left: 50%;
      width: 30vw;
      height: 30vw;
      background: radial-gradient(circle, var(--accent-pink) 0%, rgba(236, 72, 153, 0) 70%);
      opacity: 0.08;
    }

    /* Sidebar Layout */
    aside {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .sidebar-header {
      padding: 30px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 1px;
    }

    .sidebar-content {
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      flex-grow: 1;
      overflow-y: auto;
    }

    /* Category Buttons */
    .category-section h3,
    .stats-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: var(--transition-fast);
      gap: 10px;
    }

    .category-btn:hover {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    .category-btn.active {
      background-color: rgba(99, 102, 241, 0.1);
      color: var(--accent-indigo);
      font-weight: 600;
    }

    .category-btn .cat-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .category-btn .cat-name {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .category-btn .cat-count {
      font-size: 0.75rem;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--text-secondary);
      transition: var(--transition-fast);
    }

    .category-btn.active .cat-count {
      background-color: rgba(99, 102, 241, 0.2);
      color: var(--accent-indigo);
    }

    /* Stats Panel */
    .stats-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .sidebar-footer {
      padding: 20px 30px;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Main Content Layout */
    main {
      flex-grow: 1;
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
      min-width: 0;
      /* Prevents overflow inside flex container */
    }

    /* Header controls */
    header {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-bar-container {
      position: relative;
      width: 100%;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      color: var(--text-muted);
      pointer-events: none;
      width: 20px;
      height: 20px;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition-normal);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .search-input:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 8px 30px rgba(0, 0, 0, 0.3);
      background-color: rgba(17, 24, 39, 0.85);
    }

    .search-shortcut {
      position: absolute;
      right: 20px;
      font-size: 0.7rem;
      color: var(--text-muted);
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      font-weight: 700;
    }

    /* Controls: Sort and Actions */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sort-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      appearance: none;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 36px 10px 16px;
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: var(--transition-fast);
      font-family: var(--font-sans);
    }

    .select-wrapper select:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .select-wrapper select:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .select-wrapper::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: 4px solid transparent;
      border-top-color: var(--text-secondary);
      pointer-events: none;
    }

    .results-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: var(--transition-normal);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: transparent;
      transition: var(--transition-fast);
    }

    .card.cat-video::before {
      background: linear-gradient(90deg, var(--accent-indigo), var(--accent-purple));
    }

    .card.cat-graphics::before {
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
    }

    .card.cat-adobe::before {
      background: linear-gradient(90deg, var(--accent-red), var(--accent-amber));
    }

    .card.cat-audio::before {
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-blue));
    }

    .card.cat-system::before {
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-indigo));
    }

    .card.cat-office::before {
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-teal));
    }

    .card.cat-networks::before {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
    }

    .card.cat-others::before {
      background: linear-gradient(90deg, var(--accent-amber), var(--accent-red));
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 20px rgba(99, 102, 241, 0.05);
    }

    .card-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-cat {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      max-width: 170px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* Colored badge categories */
    .card.cat-video .badge-cat {
      background-color: rgba(99, 102, 241, 0.08);
      color: #a5b4fc;
      border-color: rgba(99, 102, 241, 0.2);
    }

    .card.cat-graphics .badge-cat {
      background-color: rgba(236, 72, 153, 0.08);
      color: #f9a8d4;
      border-color: rgba(236, 72, 153, 0.2);
    }

    .card.cat-adobe .badge-cat {
      background-color: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.2);
    }

    .card.cat-audio .badge-cat {
      background-color: rgba(20, 184, 166, 0.08);
      color: #99f6e4;
      border-color: rgba(20, 184, 166, 0.2);
    }

    .card.cat-system .badge-cat {
      background-color: rgba(14, 165, 233, 0.08);
      color: #bae6fd;
      border-color: rgba(14, 165, 233, 0.2);
    }

    .card.cat-office .badge-cat {
      background-color: rgba(16, 185, 129, 0.08);
      color: #a7f3d0;
      border-color: rgba(16, 185, 129, 0.2);
    }

    .card.cat-networks .badge-cat {
      background-color: rgba(139, 92, 246, 0.08);
      color: #c7d2fe;
      border-color: rgba(139, 92, 246, 0.2);
    }

    .card.cat-others .badge-cat {
      background-color: rgba(245, 158, 11, 0.08);
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.2);
    }

    .badge-pop {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .pop-high {
      background-color: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .pop-med {
      background-color: rgba(245, 158, 11, 0.08);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.15);
    }

    .pop-low {
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-primary);
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: var(--transition-fast);
      user-select: all;
    }

    .card-title:hover {
      color: var(--accent-indigo);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }

    .card-size {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-size i {
      color: var(--text-muted);
    }

    .btn-copy {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-copy:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .btn-copy:active {
      transform: scale(0.92);
    }

    /* Highlight matching search text */
    .highlight {
      background-color: rgba(250, 204, 21, 0.2);
      color: #fef08a;
      padding: 1px 3px;
      border-radius: 4px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 14px 20px;
      color: white;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    #toast i {
      color: var(--accent-emerald);
    }

    /* No Results state */
    .no-results {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
      background-color: rgba(255, 255, 255, 0.01);
      border: 1px dashed var(--border-color);
      border-radius: 16px;
      gap: 16px;
    }

    .no-results i {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
    }

    .no-results h4 {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Quick stats container in header */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-title h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Mobile Responsive */
    @media (max-width: 1024px) {
      body {
        flex-direction: column;
      }

      aside {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .sidebar-content {
        padding: 20px;
        gap: 15px;
      }

      .category-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 10px;
        -webkit-overflow-scrolling: touch;
      }

      .category-btn {
        flex-shrink: 0;
        padding: 8px 14px;
      }

      .stats-section {
        display: none;
        /* Hide stats in sidebar on mobile */
      }

      main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <div class="logo-icon">
        <i data-lucide="compass" style="width: 22px; height: 22px;"></i>
      </div>
      <div class="logo-text">
        <h1>program Walker</h1>
        <p>Каталог программ для macOS</p>
      </div>
    </div>

    <div class="sidebar-content">
      <!-- Categories Filter -->
      <div class="category-section">
        <h3>Категории</h3>
        <div class="category-list" id="categoryList">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Stats Summary -->
      <div class="stats-section">
        <h3>Статистика каталога</h3>
        <div class="stats-panel">
          <div class="stat-row">
            <span class="stat-label"><i data-lucide="archive" style="width: 14px; height: 14px;"></i> Всего
              программ</span>
            <span class="stat-value" id="statTotalCount">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label"><i data-lucide="hard-drive" style="width: 14px; height: 14px;"></i> Общий
              объем</span>
            <span class="stat-value" id="statTotalSize">0 GB</span>
          </div>
          <div class="stat-row">
            <span class="stat-label"><i data-lucide="trending-up" style="width: 14px; height: 14px;"></i> Ср.
              популярность</span>
            <span class="stat-value" id="statAvgPopularity">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label"><i data-lucide="flame" style="width: 14px; height: 14px;"></i> Топ
              популярных</span>
            <span class="stat-value" id="statTopPopCount">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span>program Walker © 2026</span>
    </div>
  </aside>

  <!-- Main Area -->
  <main>
    <header>
      <div class="header-top">
        <div class="header-title">
          <h2 id="currentCategoryTitle">Все программы</h2>
          <p id="currentCategorySub">Общий список доступного софта</p>
        </div>
        <div class="results-info" id="resultsCount">Показано: 0 из 0</div>
      </div>

      <!-- Search Bar -->
      <div class="search-bar-container">
        <div class="search-input-wrapper">

        'GB': 1024 * 1024 * 1024,
        'TB': 1024 * 1024 * 1024 * 1024
      };
      return val * (multipliers[unit] || 1);
    }

    // Format Bytes back to human readable size
    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    // Initialize Categories filter buttons in Sidebar
    function initCategories() {
      const listContainer = document.getElementById("categoryList");

      // Calculate category counters
      const counts = { all: PROGRAMS.length };
      PROGRAMS.forEach(p => {
        counts[p.category] = (counts[p.category] || 0) + 1;
      });

      // Add "All Categories" button
      const allBtn = document.createElement("button");
      allBtn.className = "category-btn active";
      allBtn.setAttribute("data-cat", "all");
      allBtn.innerHTML = `
        <div class="cat-info">
          <i data-lucide="grid" style="width: 16px; height: 16px; min-width: 16px;"></i>
          <span class="cat-name">Все категории</span>
        </div>
        <span class="cat-count">${counts.all}</span>
      `;
      allBtn.addEventListener("click", () => selectCategoryFilter("all", allBtn));
      listContainer.appendChild(allBtn);

      // Add individual category buttons
      Object.keys(CATEGORY_MAP).forEach(cat => {
        if (!counts[cat]) return; // Skip if no programs in category
        const info = CATEGORY_MAP[cat];
        const btn = document.createElement("button");
        btn.className = "category-btn";
        btn.setAttribute("data-cat", cat);
        btn.innerHTML = `
          <div class="cat-info">
            <i data-lucide="${info.icon}" style="width: 16px; height: 16px; min-width: 16px;"></i>
            <span class="cat-name">${info.short}</span>
          </div>
          <span class="cat-count">${counts[cat]}</span>
        `;
        btn.addEventListener("click", () => selectCategoryFilter(cat, btn));
        listContainer.appendChild(btn);
      });
    }

    // Handle Category change
    function selectCategoryFilter(cat, activeBtn) {
      selectedCategory = cat;

      // Update UI buttons
      document.querySelectorAll(".category-btn").forEach(btn => btn.classList.remove("active"));
      activeBtn.classList.add("active");

      // Update Titles
      const titleEl = document.getElementById("currentCategoryTitle");
      const subEl = document.getElementById("currentCategorySub");

      if (cat === "all") {
        titleEl.textContent = "Все программы";
        subEl.textContent = "Общий список доступного софта";
      } else {
        titleEl.textContent = cat;
        subEl.textContent = `Программы из категории "${CATEGORY_MAP[cat].short}"`;
      }

      filterAndRender();
    }

    // Initialize Statistics block in sidebar
    function initStats() {
      document.getElementById("statTotalCount").textContent = PROGRAMS.length.toLocaleString("ru-RU");

      let totalBytes = 0;
      let totalPopularity = 0;
      let topPopularityCount = 0;

      PROGRAMS.forEach(p => {
        totalBytes += parseSize(p.size);
        totalPopularity += p.popularity;
        if (p.popularity >= 1000) {
          topPopularityCount++;
        }
      });

      document.getElementById("statTotalSize").textContent = formatBytes(totalBytes);
      document.getElementById("statAvgPopularity").textContent = Math.round(totalPopularity / PROGRAMS.length).toLocaleString("ru-RU");
      document.getElementById("statTopPopCount").textContent = topPopularityCount.toLocaleString("ru-RU");
    }

    // Filter, Sort and Render cards list
    function filterAndRender() {
      const grid = document.getElementById("cardsGrid");
      grid.innerHTML = "";

      // 1. Filter
      let filtered = PROGRAMS.filter(p => {
        const matchesCat = (selectedCategory === "all" || p.category === selectedCategory);
        const matchesSearch = (!searchQuery || p.name.toLowerCase().includes(searchQuery) || p.category.toLowerCase().includes(searchQuery));
        return matchesCat && matchesSearch;
      });

      // Update counter
      document.getElementById("resultsCount").textContent = `Показано: ${filtered.length} из ${PROGRAMS.length}`;

      // 2. Sort
      filtered.sort((a, b) => {
        if (sortOption === "popularity-desc") {
          return b.popularity - a.popularity;
        } else if (sortOption === "popularity-asc") {
          return a.popularity - b.popularity;
        } else if (sortOption === "size-desc") {
          return parseSize(b.size) - parseSize(a.size);
        } else if (sortOption === "size-asc") {
          return parseSize(a.size) - parseSize(b.size);
        } else if (sortOption === "name-asc") {
          return a.name.localeCompare(b.name, "ru");
        } else if (sortOption === "name-desc") {
          return b.name.localeCompare(a.name, "ru");
        }
        return 0;
      });

      // 3. Render
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="no-results">
            <i data-lucide="search-slash"></i>
            <h4>Ничего не найдено</h4>
            <p>Попробуйте скорректировать запрос или выбрать другую категорию</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Render items incrementally to avoid thread block if size is large
      const batchSize = 100;
      let currentIndex = 0;

      function renderBatch() {
        const limit = Math.min(currentIndex + batchSize, filtered.length);
        const fragment = document.createDocumentFragment();

        for (let i = currentIndex; i < limit; i++) {
          const p = filtered[i];
          const catInfo = CATEGORY_MAP[p.category] || { class: "cat-others", short: "Другое" };

          const card = document.createElement("div");
          card.className = `card ${catInfo.class}`;

          // Popularity Badge Class
          let popClass = "pop-low";
          let popFlame = '<i data-lucide="flame" style="width: 12px; height: 12px; display: inline-block;"></i> ';
          if (p.popularity >= 5000) {
            popClass = "pop-high";
          } else if (p.popularity >= 1000) {
            popClass = "pop-med";
          } else if (p.popularity === 0) {
            popFlame = ''; // No flame for 0 popularity
          }

          // Highlight matching title text
          const highlightedName = highlightText(p.name, searchQuery);

          card.innerHTML = `
            <div class="card-top">
              <div class="card-badges">
                <span class="badge badge-cat">${catInfo.short}</span>
                <span class="badge badge-pop ${popClass}">${popFlame}${p.popularity.toLocaleString("ru-RU")}</span>
              </div>
              <div class="card-title" title="Нажмите дважды, чтобы скопировать название" onclick="copyName('${p.name.replace(/'/g, "\'")}')">${highlightedName}</div>
            </div>
            <div class="card-bottom">
              <div class="card-size">
                <i data-lucide="hard-drive" style="width: 14px; height: 14px;"></i>
                <span>${p.size}</span>
              </div>
              <button class="btn-copy" title="Скопировать название программы" onclick="copyName('${p.name.replace(/'/g, "\'")}')">
                <i data-lucide="copy" style="width: 16px; height: 16px;"></i>
              </button>
            </div>
          `;
          fragment.appendChild(card);
        }

        grid.appendChild(fragment);
        lucide.createIcons({ attrs: { class: 'lucide-icon' } }); // refresh newly added cards' icons

        currentIndex = limit;
        if (currentIndex < filtered.length) {
          requestAnimationFrame(renderBatch);
        }
      }

      renderBatch();
    }

    // Helper: Escape Regex special characters
    function escapeRegex(string) {
      return string.replace(/[/\-\[\]{}()*+?.,\\^$|#\s]/g, "\\$&");
    }

    // Helper: Highlight matched search text
    function highlightText(text, search) {
      if (!search) return text;
      const regex = new RegExp(`(${escapeRegex(search)})`, 'gi');
      return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    // Copy program name to clipboard
    function copyName(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Название "${text.substring(0, 30)}${text.length > 30 ? '...' : ''}" скопировано в буфер!`);
      }).catch(err => {
        console.error('Не удалось скопировать текст: ', err);
      });
    }

    // Show custom toast notification
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");

      toastText.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // Bind Keyboard shortcuts: '/' key to focus search bar
    function initKeyboardShortcuts() {
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== document.getElementById("searchInput")) {
          e.preventDefault();
          document.getElementById("searchInput").focus();
        }
      });
    }
  </script>
